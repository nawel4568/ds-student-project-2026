name: report

on:
  push:
    branches:
      - main
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Git tag format
        if: startsWith(github.ref_name, 'v')
        env:
          REPORT_TAG: ${{ github.ref_name }}
        run: |
          _tag="$REPORT_TAG"
          if ! printf "%s\n" "$_tag" | grep -q -P '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$'; then
            printf '[ERROR]: Git tag (%s) wrong format\n' "$_tag"
            exit 1
          fi

      - name: Compile
        run: |
          make report-build

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref , 'refs/tags/v') && github.ref_name || 'nightly' }}
          prerelease: ${{ startsWith(github.ref , 'refs/tags/v') != true }}
          name: ${{ startsWith(github.ref , 'refs/tags/v') && github.ref_name || 'Nightly' }}
          files: report.pdf
